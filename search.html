<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · znjxz · 笔记花园</title>
<link rel="alternate" type="application/rss+xml" title="笔记花园" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap">
<style>
  :root {
    --paper:#faf8f5; --ink:#1f1d1a; --ink-soft:#3d3934; --muted:#8a8279;
    --gold:#8c7554; --rule:#ddd6cb; --rule-soft:#ece7df; --paper-deep:#f3efe9;
  }
  @media (prefers-color-scheme:dark) {
    :root { --paper:#1a1917; --ink:#e8e3da; --ink-soft:#c9c3b8; --muted:#8f877c;
            --gold:#c9a97a; --rule:#33302b; --rule-soft:#272521; --paper-deep:#211f1c; }
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"EB Garamond","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
    font-size:18.5px;line-height:1.85;
    font-feature-settings:"palt" 1,"kern" 1,"liga" 1;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.36;
    background-image:
      radial-gradient(circle at 18% 24%,rgba(140,117,84,.035) 0 1px,transparent 1px),
      radial-gradient(circle at 72% 68%,rgba(140,117,84,.028) 0 1px,transparent 1px);
    background-size:137px 149px,211px 197px;
  }
  .wrap{position:relative;z-index:1;max-width:40rem;margin:0 auto;padding:5.5rem 1.75rem 7rem}
  header{margin-bottom:1rem}
  .eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
           color:var(--gold);margin:0 0 1.5rem;font-weight:500}
  h1{font-size:2.15rem;font-weight:400;line-height:1.25;letter-spacing:.015em;margin:0 0 .85rem}
  h1 em{font-style:italic;color:var(--ink-soft)}
  .sub{color:var(--muted);font-size:1rem;line-height:1.7;margin:0;max-width:30rem}
  .rule-double{margin:2.75rem 0 0;border:0;border-top:1px solid var(--rule);
                border-bottom:1px solid var(--rule-soft);height:3px}
  nav.top{margin:2rem 0 0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
  nav.top a{color:var(--muted);text-decoration:none;margin-right:1.4rem;
            border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
  nav.top a:hover,nav.top a.on{color:var(--gold);border-color:var(--gold)}
  h2{font-size:.74rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
     color:var(--muted);margin:4rem 0 1.75rem;padding-bottom:.85rem;
     border-bottom:1px solid var(--rule-soft)}
  h2 .n{color:var(--rule);margin-left:.6rem;letter-spacing:.05em}
  ul{list-style:none;padding:0;margin:0}
  li+li{border-top:1px solid var(--rule-soft)}
  li a{display:block;padding:1.35rem .5rem 1.35rem 0;color:inherit;text-decoration:none;
        transition:padding-left .25s ease}
  li a:hover{padding-left:.55rem}
  li a:hover .t{color:var(--gold)}
  .t{display:block;font-size:1.15rem;font-weight:500;line-height:1.5;transition:color .25s ease}
  .d{display:block;color:var(--muted);font-size:.95rem;line-height:1.65;margin-top:.4rem}
  .when{display:block;color:var(--rule);font-size:.72rem;letter-spacing:.16em;
         text-transform:uppercase;margin-top:.55rem}
  .note{margin-top:1rem;padding:1.9rem 0 0 1.6rem;border-left:1px solid var(--gold);
         font-size:1rem;line-height:1.95;color:var(--ink-soft)}
  .note em{color:var(--muted);font-style:italic}
  footer{margin-top:5.5rem;padding-top:1.9rem;border-top:1px solid var(--rule);
          color:var(--muted);font-size:.82rem;letter-spacing:.05em}
  footer p{margin:0}
  footer .sep{color:var(--rule);margin:0 .7rem}
  /* 搜索 */
  .searchbox{position:relative;margin:2.5rem 0 0}
  input[type=search]{
    width:100%;padding:1rem 1.1rem;font:inherit;font-size:1.05rem;color:var(--ink);
    background:var(--paper-deep);border:1px solid var(--rule);border-radius:3px;outline:none;
  }
  input[type=search]:focus{border-color:var(--gold)}
  .hint{color:var(--muted);font-size:.85rem;margin:.9rem 0 0;letter-spacing:.03em}
  .hit{margin:0}
  .hit mark{background:rgba(200,169,122,.3);color:inherit;padding:.05em .2em;border-radius:2px}
  .empty{color:var(--muted);padding:2rem 0;font-size:1rem}
  @media (max-width:520px){
    body{font-size:17.5px}
    .wrap{padding:3.5rem 1.3rem 5rem}
    h1{font-size:1.8rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Search</p>
    <h1>在<span></span>花园里<em>找东西</em></h1>
    <p class="sub">这些笔记还在生长。会改写、会增补，也会删掉当初觉得对的部分。</p>
    <hr class="rule-double">
    <nav class="top"><a href="/">首页</a><a href="/archive.html">归档</a><a href="/search.html" class="on">搜索</a></nav>
  </header>
  <div class="searchbox">
    <input id="q" type="search" placeholder="搜标题、摘要、正文…" autocomplete="off">
  </div>
  <p class="hint" id="hint">输入关键词，标题命中优先；支持多词（空格分隔）。</p>
  <ul id="hits"></ul>

<script>
const BASE="/notes/";
let DATA=null;
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mark(s,q){
  if(!q)return esc(s);
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(s).replace(re,"<mark>$1</mark>");
}
function score(n,terms){
  let s=0;
  const t=n.t.toLowerCase(), d=(n.d||"").toLowerCase(), b=(n.b||"").toLowerCase(),
        g=(n.g||"").toLowerCase(), tags=(n.tags||[]).join(" ").toLowerCase();
  for(const w of terms){
    let hit=0;
    if(t.includes(w)){hit+=8; if(t.startsWith(w))hit+=6;}
    if(tags.includes(w))hit+=4;
    if(g.includes(w))hit+=2;
    if(d.includes(w))hit+=3;
    if(b.includes(w))hit+=1;
    if(!hit)return 0;
    s+=hit;
  }
  return s;
}
function render(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const ul=$("#hits"), hint=$("#hint");
  if(!terms.length){ul.innerHTML="";hint.textContent="输入关键词，标题命中优先；支持多词（空格分隔）。";return;}
  const hits=DATA.map(n=>({n,s:score(n,terms)})).filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s||(b.n.c||"").localeCompare(a.n.c||""));
  hint.textContent=hits.length?`${hits.length} 条结果`:"没有匹配。试试更短的词。";
  ul.innerHTML=hits.map(({n})=>`<li><a href="${BASE}${n.f}"><span class="t">${mark(n.t,terms[0])}</span><span class="d">${esc((n.d||"").slice(0,120))}</span><span class="when">${esc(n.g||"")}${n.c?" · "+esc(n.c):""}</span></a></li>`).join("");
}
fetch("/search-index.json").then(r=>r.json()).then(d=>{DATA=d;const p=new URLSearchParams(location.search).get("q");if(p){$("#q").value=p;render(p);}});
$("#q").addEventListener("input",e=>render(e.target.value.trim()));
</script>

  <footer>
    <p>© <span id="y"></span> znjxz<span class="sep">·</span>持续更新<span class="sep">·</span>非终稿</p>
  </footer>
</div>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
