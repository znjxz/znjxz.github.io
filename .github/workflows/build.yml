name: Build site from Obsidian vault

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout vault repo (private)
        uses: actions/checkout@v4
        with:
          repository: znjxz/obsidian-vault-backup
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install markdown pyyaml

      - name: Build
        run: |
          python .github/scripts/build_site.py \
            --vault .vault \
            --out .

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes || true
          git diff --cached --quiet || git commit -m "build: regenerate notes"
          git push || true
